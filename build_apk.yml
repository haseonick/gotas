name: Compilar APK y AAB para Google Play

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Configurar Java (JDK 17)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar APK de lanzamiento (Release APK)
        run: flutter build apk --release

      - name: Compilar Android App Bundle (AAB para Google Play Store)
        run: flutter build appbundle --release

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Gotas-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Subir AAB como artefacto descargable (para Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: Gotas-PlayStore-AAB
          path: build/app/outputs/bundle/release/app-release.aab
